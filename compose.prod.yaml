# TLS front door. Use after the domain points at this host:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# Set DOMAIN and ACME_EMAIL in .env. Set COOKIE_SECURE=1.

services:
  app:
    ports: !reset []
    environment:
      COOKIE_SECURE: "1"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
